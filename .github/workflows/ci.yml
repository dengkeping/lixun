name: ci

on:
  push:
    branches: [main, wave-d-semantic]
  pull_request:

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  default:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install native build and test dependencies
        run: pacman -Syu --noconfirm --needed git clang cmake protobuf gtk4 gtk4-layer-shell poppler-glib libheif openssl pkgconf xorg-server-xvfb xorg-xauth tesseract tesseract-data-eng sway wtype wl-clipboard ttf-dejavu python
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked -p lixun-semantic-worker
      - run: cargo test --locked --workspace
      - run: cargo build --locked --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --all -- --check

  semantic:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install native build and test dependencies
        run: pacman -Syu --noconfirm --needed git clang cmake protobuf gtk4 gtk4-layer-shell poppler-glib libheif openssl pkgconf xorg-server-xvfb xorg-xauth tesseract tesseract-data-eng sway wtype wl-clipboard ttf-dejavu python
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: semantic
      - name: Trust the mounted checkout for release checks
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bash scripts/qa-wave-d.sh
      - name: Exercise the launcher on headless Wayland
        run: |
          # Headless Sway needs no hardware privileges. Arch's file capabilities
          # otherwise prevent exec under the container's capability bounding set.
          install -m755 /usr/bin/sway /usr/local/bin/sway
          export PATH="$GITHUB_WORKSPACE/target/release:/usr/local/bin:$PATH"
          runuser -u nobody --preserve-environment -- bash tests/desktop-smoke.sh
