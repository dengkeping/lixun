name: feature-matrix

on:
  push:
    branches: [main, wave-d-semantic]
  pull_request:

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  matrix:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      matrix:
        include:
          # legacy-json-ipc (lixun-ipc)
          - crate: lixun-ipc
            flag: legacy-json-ipc
            state: "on"
          - crate: lixun-ipc
            flag: legacy-json-ipc
            state: "off"
          # image-decode (lixun-semantic-worker)
          - crate: lixun-semantic-worker
            flag: image-decode
            state: "on"
          - crate: lixun-semantic-worker
            flag: image-decode
            state: "off"
          # jemalloc (lixun-semantic-worker)
          - crate: lixun-semantic-worker
            flag: jemalloc
            state: "on"
          # quantized-embedders (lixun-semantic-worker)
          - crate: lixun-semantic-worker
            flag: quantized-embedders
            state: "on"
          # idle-eviction (lixun-semantic-worker)
          - crate: lixun-semantic-worker
            flag: idle-eviction
            state: "on"
          # minimum build: no default features across workspace
          - crate: workspace
            flag: none
            state: "off"
    steps:
      - name: Install native build and test dependencies
        run: pacman -Syu --noconfirm --needed git clang cmake protobuf gtk4 gtk4-layer-shell poppler-glib libheif openssl pkgconf xorg-server-xvfb xorg-xauth tesseract tesseract-data-eng sway wtype wl-clipboard ttf-dejavu python
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: feature-matrix-${{ matrix.crate }}-${{ matrix.flag }}-${{ matrix.state }}

      - name: Build workspace (default features)
        if: matrix.crate == 'workspace' && matrix.flag == 'none'
        run: cargo build --locked --workspace

      - name: Build workspace (--no-default-features)
        if: matrix.crate == 'workspace' && matrix.flag == 'none'
        run: cargo build --locked --workspace --no-default-features

      - name: Build crate with flag ON
        if: matrix.crate != 'workspace' && matrix.state == 'on'
        run: cargo build --locked --manifest-path crates/${{ matrix.crate }}/Cargo.toml --no-default-features --features ${{ matrix.flag }}

      - name: Build crate with flag OFF
        if: matrix.crate != 'workspace' && matrix.state == 'off'
        run: cargo build --locked --manifest-path crates/${{ matrix.crate }}/Cargo.toml --no-default-features
      - name: Run negotiated IPC fixtures
        if: matrix.crate == 'lixun-ipc'
        run: |
          if [ "${{ matrix.state }}" = on ]; then
            cargo test --locked -p lixun-ipc --features legacy-json-ipc
          else
            cargo test --locked -p lixun-ipc --no-default-features
          fi
