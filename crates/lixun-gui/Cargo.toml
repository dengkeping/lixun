[package]
name = "lixun-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lixun-core = { path = "../lixun-core" }
lixun-ipc = { path = "../lixun-ipc" }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
toml_edit = "0.22"
dirs = "5"
glib = "0.22"
gio-unix = "0.22"
gtk.workspace = true
gtk4-layer-shell = "0.8"
gdk4-wayland = { version = "0.11", features = ["wayland_crate"] }
wayland-client = "0.31"
wayland-protocols = { workspace = true, features = ["staging"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
notify.workspace = true
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
opener = "0.8"
async-channel = "2"
libc = "0.2"
chrono.workspace = true
# Freedesktop thumbnail-cache keys are MD5 digests of the file URI
# (R1). md5 0.8 is already in the workspace graph via the RAW decode
# stack, so this adds no new external dependency.
md5 = "0.8"
# Same diacritic folding as the index tokenizer (NFKD + strip
# combining marks) so match highlighting agrees with what actually
# matched (R2). Already in the graph via lixun-index.
unicode-normalization = { workspace = true }
lixun-config = { path = "../lixun-config" }
lixun-preview = { path = "../lixun-preview" }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "render_path"
harness = false

[lib]
name = "lixun_gui"
path = "src/lib.rs"
