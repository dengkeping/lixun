[package]
name = "lixun-preview-bin"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lixun-preview"
path = "src/main.rs"

[features]
default = []
stub = []

[dependencies]
lixun-core = { path = "../lixun-core" }
lixun-preview = { path = "../lixun-preview" }
lixun-preview-bundle = { path = "../lixun-preview-bundle" }
lixun-config = { path = "../lixun-config" }
lixun-ipc = { path = "../lixun-ipc" }
anyhow.workspace = true
clap.workspace = true
inventory.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-channel = "2"
libc = "0.2"
glib = "0.22"
gtk.workspace = true
# Same version the launcher (lixun-gui) already carries — the preview
# joins the launcher's Overlay layer so it can render beside it
# (Wayland stacks the overlay layer above every xdg-toplevel).
gtk4-layer-shell = "0.8"
gdk4-wayland = { version = "0.11", features = ["wayland_crate"] }
wayland-client = "0.31"
wayland-protocols.workspace = true
