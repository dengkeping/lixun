[package]
name = "lixun-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lixun-core = { path = "../lixun-core" }
lixun-mutation = { path = "../lixun-mutation" }
serde.workspace = true
serde_json.workspace = true
postcard = { version = "1", features = ["use-std"] }
tokio.workspace = true
tokio-util = { workspace = true, features = ["codec"] }
bytes.workspace = true
chrono.workspace = true
dirs = "5"
libc = "0.2"

[features]
default = ["legacy-json-ipc"]
# legacy-json-ipc (default: ON for this release)
#   Gates the v4 serde_json IPC codec. When A2 migrates to a binary
#   framing, this flag becomes default-OFF and the serde_json path
#   is compiled out.
#   Rollback: cargo build -p lixun-ipc --no-default-features --features legacy-json-ipc
#   Evidence: .workspace-local/evidence/task-a2-ipc-framing.log
legacy-json-ipc = []
