[package]
name = "lixun-semantic-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Semantic-search sidecar worker spawned by lixund."
autobenches = false

[[bin]]
name = "lixun-semantic-worker"
path = "src/main.rs"

[[bin]]
name = "memory-states-harness"
path = "benches/memory_states.rs"
required-features = ["bench-harness"]

[dependencies]
lixun-core = { path = "../lixun-core" }
lixun-mutation = { path = "../lixun-mutation" }
lixun-semantic-proto = { path = "../lixun-semantic-proto" }
lixun-image-decode = { path = "../lixun-image-decode", optional = true }

# Heavy ML stack — same workspace pins as the in-process plugin.
fastembed = { workspace = true }
lancedb = { workspace = true }
arrow = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }

tokio = { workspace = true }
# `codec` is required for FrameCodec's Encoder/Decoder traits; the
# workspace pin only enables `io`.
tokio-util = { workspace = true, features = ["io", "codec"] }
futures = "0.3"
async-trait = "0.1"

serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
bytes.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { workspace = true }
image = { workspace = true }
libc = "0.2"
rusqlite = { workspace = true }
dirs = "5"
tempfile = "3"
# Lock-free Arc swap used by the B4 idle-eviction supervisor to
# hot-swap embedder slots without blocking concurrent readers.
# Pulled in only when the `idle-eviction` feature is enabled.
arc-swap = { version = "1", optional = true }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6", optional = true }
tikv-jemalloc-ctl = { version = "0.6", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
# Default feature set. All three memory-saving subsystems
# (jemalloc, quantized-embedders, idle-eviction) are now default-ON
# after empirical confirmation that the default-off worker held
# 2.75 GB anonymous heap with all three embedders eagerly resident.
# Each can be bisected with --no-default-features --features "..."
# if one of them regresses.
default = ["image-decode", "jemalloc", "quantized-embedders", "idle-eviction"]

# image-decode (default: ON as of B5)
#   Compiles the in-process image decoder (HEIC/JXL/RAW transitive deps)
#   into the worker. Was flipped OFF in W0.4 pending a size audit;
#   B5 measured +10.4 MiB .text / +17.0 MiB file — below threshold,
#   so the default is restored to ON.
#   Disable: cargo build -p lixun-semantic-worker --no-default-features
#   Evidence: .workspace-local/evidence/task-b5-summary.md
image-decode = ["lixun-image-decode"]

# jemalloc (default: OFF until harness verifies ≥20% drop)
#   Links tikv-jemallocator and sets proactive decay tuning.
#   Rollback: cargo build -p lixun-semantic-worker --no-default-features
#   Evidence: .workspace-local/evidence/task-b1-jemalloc.log
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]

# quantized-embedders (default: OFF)
#   When enabled, the worker selects the statically-quantized int8
#   variant of the BGE small text embedder
#   (EmbeddingModel::BGESmallENV15Q, ~33 MB) instead of the fp32
#   weights (~130 MB) with published MTEB loss < 1% for typical
#   English retrieval. The CLIP image and CLIP text sides stay on
#   fp32 because fastembed 5.13.3 does not ship pre-quantized
#   variants of either ClipVitB32 enum; that gap is tracked in
#   .workspace-local/notepads/launcher-perf-and-semantic-memory/decisions.md.
#   Rollback: cargo build -p lixun-semantic-worker --no-default-features
#   Evidence: .workspace-local/evidence/task-b2-{build,build-quant,build-both,tests}.log
quantized-embedders = []

# idle-eviction (default: OFF until heaptrack proof — see B4 evidence)
#   When enabled, the worker supervisor (src/supervisor.rs) drops
#   loaded embedder Sessions after `idle_threshold_secs` (default 300)
#   and lazily reloads them on next demand. Compounds with B1
#   jemalloc decay: the OS reclaims freed ORT arenas within
#   ~5 s of Session drop. Adds `arc-swap` for lock-free slot swap.
#   Rollback: cargo build -p lixun-semantic-worker --no-default-features
#   Evidence: .workspace-local/evidence/task-b4-{build,build-feature,build-jemalloc,build-all,summary}.{log,md}
idle-eviction = ["dep:arc-swap"]

# bench-harness (default: OFF)
#   Gates the `memory-states-harness` binary so it is built only when
#   explicitly requested for heaptrack profiling. Without this gate, a
#   plain `cargo build --release` produced a 237 MB harness binary
#   alongside `lixun-semantic-worker` in target/release/, polluting
#   production artefacts. Build: cargo build -p lixun-semantic-worker
#   --features bench-harness --bin memory-states-harness
bench-harness = []

