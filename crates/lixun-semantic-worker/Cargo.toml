[package]
name = "lixun-semantic-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Semantic-search sidecar worker spawned by lixund."
autobenches = false

[[bin]]
name = "lixun-semantic-worker"
path = "src/main.rs"

[[bin]]
name = "memory-states-harness"
path = "benches/memory_states.rs"

[dependencies]
lixun-core = { path = "../lixun-core" }
lixun-mutation = { path = "../lixun-mutation" }
lixun-semantic-proto = { path = "../lixun-semantic-proto" }
lixun-image-decode = { path = "../lixun-image-decode", optional = true }

# Heavy ML stack — same workspace pins as the in-process plugin.
fastembed = { workspace = true }
lancedb = { workspace = true }
arrow = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }

tokio = { workspace = true }
# `codec` is required for FrameCodec's Encoder/Decoder traits; the
# workspace pin only enables `io`.
tokio-util = { workspace = true, features = ["io", "codec"] }
futures = "0.3"
async-trait = "0.1"

serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
bytes.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { workspace = true }
image = { workspace = true }
libc = "0.2"
rusqlite = { workspace = true }
dirs = "5"
tempfile = "3"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6", optional = true }
tikv-jemalloc-ctl = { version = "0.6", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
# Default feature set kept intentionally minimal. Heavy or invasive
# subsystems opt in via the named flags below so a regression in any
# one of them can be bisected and disabled in isolation.
default = []

# image-decode (default: OFF as of W0.4)
#   Compiles the in-process image decoder (HEIC/JXL/RAW transitive deps)
#   into the worker. Flipped OFF in W0.4 to remove the decoder from the
#   default build; B5 will move it permanently into the sidecar process.
#   Rollback: cargo build -p lixun-semantic-worker --features image-decode
#   Evidence: .workspace-local/evidence/task-b5-image-decode.log
image-decode = ["lixun-image-decode"]

# jemalloc (default: OFF until harness verifies ≥20% drop)
#   Links tikv-jemallocator and sets proactive decay tuning.
#   Rollback: cargo build -p lixun-semantic-worker --no-default-features
#   Evidence: .workspace-local/evidence/task-b1-jemalloc.log
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]

# quantized-embedders (default: OFF)
#   Reserved placeholder for B2. When enabled, the worker selects
#   pre-quantized embedder variants (BGE small int8, CLIP int8) instead
#   of the FP32 weights. Empty until B2 wires the fastembed selection.
#   Rollback: cargo build -p lixun-semantic-worker --no-default-features
#   Evidence: .workspace-local/evidence/task-b2-quantized.log
quantized-embedders = []

# idle-eviction (default: OFF)
#   Reserved placeholder for B4. When enabled, the worker supervisor
#   drops loaded embedder Sessions after an idle window and lazily
#   reloads on next demand. Empty until B4 wires the supervisor.
#   Rollback: cargo build -p lixun-semantic-worker --no-default-features
#   Evidence: .workspace-local/evidence/task-b4-idle-eviction.log
idle-eviction = []

